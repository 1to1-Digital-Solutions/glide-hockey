name: CI

# **Solo al publicar a `main`.** El trabajo entra por `develop` continuamente —cada tarea
# de un agente es un merge— y esto tarda veinte minutos por los e2e: correrlo ahí se comía
# la cuota de Actions de la organización en una semana. Lo que protege `main` es lo que
# importa, porque es lo que se despliega. Lo de `develop` ya lo verifican los gates que
# Organízate ejecuta sobre la rama antes de integrarla, en esta misma máquina y gratis.
#
# `workflow_dispatch` deja lanzarlo a mano desde GitHub sin tener que empujar nada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones antiguas de la misma rama: solo interesa la última.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos y unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Este fichero llega con el proyecto recién creado, antes de que exista nada que
      # instalar. Un CI en rojo desde el primer commit se aprende a ignorar, así que
      # mientras no haya lockfile no hay nada que comprobar y el trabajo se salta entero.
      - id: proyecto
        run: |
          if [ -f package-lock.json ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay proyecto que verificar (sin package-lock.json)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.proyecto.outputs.hay == 'si'
        uses: actions/setup-node@v4
        with:
          # La versión exacta vive en `.nvmrc`: el formato del `package-lock.json` cambia
          # entre versiones de npm, así que el CI y quien desarrolla usan la misma.
          node-version-file: .nvmrc
          cache: npm
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm ci
      # `--if-present` porque el proyecto va creciendo: los scripts aparecen con la primera
      # versión, y hasta entonces su ausencia no es un fallo.
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm run lint --if-present
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm run typecheck --if-present
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm test --if-present
      # Con el mínimo de cobertura del dominio (`vitest.config.mts`): los tests en
      # verde no dicen nada si la mitad del código no se ejecuta en ninguno.
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm run coverage --if-present
      - if: steps.proyecto.outputs.hay == 'si'
        run: npm run build --if-present

      # Guardián del lockfile: si `package.json` y `package-lock.json` se han
      # desincronizado, un install los reconcilia y reescribe el lock. Aquí eso salta en vez
      # de aparecer como ruido en el diff de otra tarea — que es como se descubrió.
      #
      # Tiene que ser un install REAL. Con `--package-lock-only` daría falso positivo: esa
      # variante construye el árbol ideal completo y añade dependencias empaquetadas de
      # paquetes opcionales de otras plataformas que un install normal no escribe.
      #
      # Va después del `npm ci` a propósito: reinstalar sobre un árbol ya montado es lo que
      # hace quien desarrolla, y es donde el desajuste se nota.
      - name: El lockfile está sincronizado con package.json
        if: steps.proyecto.outputs.hay == 'si'
        run: |
          npm install
          if ! git diff --exit-code package-lock.json; then
            echo "::error::Un install ha reescrito package-lock.json: está desincronizado con package.json. Ejecuta 'npm install' en local con la versión de Node de .nvmrc y commitea el lock."
            exit 1
          fi

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Los tests de navegador llegan más tarde que el proyecto, y bajarse Chromium en
      # cada repo que todavía no los tiene son minutos de nada.
      - id: playwright
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.playwright.outputs.hay == 'si'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.playwright.outputs.hay == 'si'
        run: npm ci
      # Solo Chromium: una escena en 3D necesita WebGL, y `--with-deps` trae las librerías
      # de sistema que SwiftShader pide en el runner.
      - if: steps.playwright.outputs.hay == 'si'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.hay == 'si'
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ steps.playwright.outputs.hay == 'si' && !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
