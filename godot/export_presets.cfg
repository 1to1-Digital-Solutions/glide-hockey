; Preset with which `xrcade/scripts/pack-game.sh` generates the game's .pck.
; The tests stay out: they run in the engine, they do not travel to the hall.
; And so does `godot-kit.json`: it belongs to the build, and at the `res://` root
; of the package it would land on top of that of any other mounted game. The
; controller profiles (`.json`), their MIT licence and the credits are not Godot
; resources and are asked for separately: the licence has to travel with every
; copy of the models.
;
; The platform does not matter for a resources-only package (it carries no
; engine binary), but Godot requires the preset to declare one.

[preset.0]

name="pack"
platform="macOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="etc2,astc"
export_filter="all_resources"
include_filter="games/glide-hockey/mandos/*.json, games/glide-hockey/mandos/LICENSE.md, games/glide-hockey/CREDITS.md"
exclude_filter="games/glide-hockey/tests/*, godot-kit.json"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
