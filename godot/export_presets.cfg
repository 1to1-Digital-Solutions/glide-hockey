; Preset con el que `xrcade/scripts/pack-game.sh` genera el .pck del juego.
; Los tests se quedan fuera: se ejecutan en el motor, no viajan al salón. Y
; `godot-kit.json` también: es del build, y en la raíz `res://` del paquete
; caería encima del de cualquier otro juego montado. Los perfiles de los mandos
; (`.json`), su licencia MIT y los créditos no son recursos de Godot y se piden
; aparte: la licencia tiene que viajar con cada copia de los modelos.
;
; La plataforma da igual para un paquete de solo recursos (no lleva binario del
; motor), pero Godot exige que el preset declare una.

[preset.0]

name="pack"
platform="macOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="games/glide-hockey/mandos/*.json, games/glide-hockey/mandos/LICENSE.md, games/glide-hockey/CREDITS.md"
exclude_filter="games/glide-hockey/tests/*, godot-kit.json"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

